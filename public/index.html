<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#110D0A" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Chereka" />
    <!--
      Home-screen icon: Safari falls back to a letter (C for Chereka) when the
      touch icon is missing or was cached as a failed fetch. Use root conventional
      names + a versioned file, never query strings (Safari caches those badly).
    -->
    <link rel="apple-touch-icon" href="/apple-touch-icon-v5.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/chereka-180.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/chereka-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/chereka-512.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>%WEB_TITLE%</title>
    <style id="expo-reset">
      html,
      body {
        height: 100%;
        background-color: #110D0A;
      }

      body {
        overflow: hidden;
      }

      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }

      /* Home-screen launch with a black-translucent status bar: iOS resolves
         100% to the screen minus the status bar, leaving a dead band at the
         bottom. 100vh is the full screen there. Browser tabs keep 100%. */
      @media all and (display-mode: standalone) {
        html,
        body,
        #root {
          height: 100vh;
        }
      }

      /* The shared phone is a game surface, not selectable page copy. */
      #root {
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
      }

      input,
      textarea,
      [contenteditable="true"] {
        -webkit-user-select: text;
        user-select: text;
        -webkit-touch-callout: default;
      }
    </style>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
